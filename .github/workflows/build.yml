name: Build SpawnBridge

on:
  push:
    branches: [ main, spawnbridge ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional release tag, e.g. v0.3.0'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Build universal dylibs
        run: ./build.sh

      - name: Upload raw build
        uses: actions/upload-artifact@v4
        with:
          name: Liter8SpawnBridge-raw
          path: |
            dist/Liter8SpawnBridge.dylib
            dist/lhook-universal.dylib

  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download raw build
        uses: actions/download-artifact@v4
        with:
          name: Liter8SpawnBridge-raw
          path: dist

      - name: Set version
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          INPUT_TAG="${{ inputs.release_tag }}"
          if [[ -n "$INPUT_TAG" ]]; then TAG="$INPUT_TAG"; fi
          if [[ "$TAG" == v* ]]; then
            VERSION="${TAG#v}"
          else
            VERSION="0.3.0+${GITHUB_SHA::7}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build rootless deb
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="$RUNNER_TEMP/pkg"
          mkdir -p \
            "$ROOT/DEBIAN" \
            "$ROOT/var/jb/usr/lib" \
            "$ROOT/var/jb/usr/share/liter8spawnbridge"

          cp dist/Liter8SpawnBridge.dylib \
            "$ROOT/var/jb/usr/lib/Liter8SpawnBridge.dylib"

          cp dist/lhook-universal.dylib \
            "$ROOT/var/jb/usr/share/liter8spawnbridge/lhook-universal.dylib"

          cat > "$ROOT/DEBIAN/control" <<CONTROL
          Package: com.gru2007.liter8spawnbridge
          Name: Liter8 SpawnBridge
          Version: ${{ steps.version.outputs.version }}
          Architecture: iphoneos-arm64
          Description: Universal two-stage Liter8 router. xpcproxy receives only the small bridge; final non-blacklisted targets receive ElleKit TweakLoader.
          Maintainer: gru2007
          Author: gru2007
          Section: Tweaks
          Depends: ellekit
          Firmware: >= 15.0
          CONTROL

          cat > "$ROOT/DEBIAN/postinst" <<'POSTINST'
          #!/bin/sh
          set -e

          mkdir -p /var/jb/tmp

          # Keep injection disabled until the universal /usr/lib/lhook has been
          # installed from SSHRD and the device has completed a normal boot.
          rm -f /var/jb/.lhook_enabled /var/jb/.lhook_debug

          # Remove the obsolete v0.1.x ElleKit-loaded copy. v0.3's router is
          # inserted directly into xpcproxy by the universal system lhook.
          rm -f /var/jb/usr/lib/TweakInject/Liter8SpawnBridge.dylib
          rm -f /var/jb/usr/lib/TweakInject/Liter8SpawnBridge.plist

          echo "[Liter8SpawnBridge] Installed universal router." >&2
          echo "[Liter8SpawnBridge] Injection is disabled until you re-enable it manually." >&2
          echo "[Liter8SpawnBridge] Install lhook-universal.dylib as /usr/lib/lhook from SSHRD, boot normally, then touch /var/jb/.lhook_enabled." >&2
          exit 0
          POSTINST
          chmod 0755 "$ROOT/DEBIAN/postinst"

          cat > "$ROOT/DEBIAN/prerm" <<'PRERM'
          #!/bin/sh
          rm -f /var/jb/.lhook_enabled /var/jb/.lhook_debug
          exit 0
          PRERM
          chmod 0755 "$ROOT/DEBIAN/prerm"

          dpkg-deb --root-owner-group -Zxz --build "$ROOT" \
            "dist/com.gru2007.liter8spawnbridge_${{ steps.version.outputs.version }}_iphoneos-arm64.deb"

      - name: Checksums
        run: |
          cd dist
          sha256sum Liter8SpawnBridge.dylib lhook-universal.dylib *.deb > SHA256SUMS.txt

      - name: Upload packaged build
        uses: actions/upload-artifact@v4
        with:
          name: Liter8SpawnBridge
          path: dist/*

      - name: Publish tag release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Liter8 SpawnBridge ${GITHUB_REF_NAME}" \
            --generate-notes

      - name: Publish manual release
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.release_tag }}" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Liter8 SpawnBridge ${{ inputs.release_tag }}" \
            --generate-notes
